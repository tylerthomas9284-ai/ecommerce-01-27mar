<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Ornava support for product, order, and policy help." />
  <title>Contact Us | Ornava</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="contact.html">
  <div class="site-shell">
    <div data-site-header></div>
    <main class="site-main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Contact</p>
          <h1>Get in touch with Ornava support.</h1>
          <p>Email support@ornava.site, call our USA customer service line, or send a message below.</p>
        </div>
      </section>
      <section class="section">
        <div class="container contact-grid">
          <div class="contact-card">
            <h2>Send us a message</h2>
            <form class="feedback-form" data-contact-form data-form-type="contact">
              <input class="field" type="text" name="name" placeholder="Full name" required />
              <input class="field" type="email" name="email" placeholder="Email address" required />
              <textarea class="textarea" name="message" placeholder="How can we help?" required></textarea>
              <button class="btn" type="submit">Submit</button>
            </form>
            <p class="status-text" data-form-success></p>
          </div>
          <div class="contact-card">
            <h2>Customer Service</h2>
            <p><strong>Email:</strong> support@ornava.site</p>
            <p><strong>Phone:</strong> (212) 555-0189</p>
            <p><strong>Address:</strong> 350 Fifth Avenue, Suite 2100, New York, NY 10118</p>
            <div class="map-card">
              <iframe src="https://www.google.com/maps?q=350%20Fifth%20Avenue%2C%20New%20York%2C%20NY%2010118&output=embed" loading="lazy" allowfullscreen title="Ornava map location"></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div data-newsletter></div>
    <div data-site-footer></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
