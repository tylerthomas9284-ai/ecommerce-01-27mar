<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shop the Ornava accessory catalog including watches, bags, sunglasses, and jewelry." />
  <title>Shop | Ornava</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="shop.html">
  <div class="site-shell">
    <div data-site-header></div>
    <main class="site-main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Shop</p>
          <h1>Browse the Ornava collection.</h1>
          <p>Search by keyword or filter by category to find the right accessory.</p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="shop-toolbar">
            <input class="field" type="search" placeholder="Search all products..." data-shop-search />
            <div class="filter-row">
              <button class="filter-btn active" type="button" data-category="All">All</button>
              <button class="filter-btn" type="button" data-category="Watches">Watches</button>
              <button class="filter-btn" type="button" data-category="Sunglasses">Sunglasses</button>
              <button class="filter-btn" type="button" data-category="Bags">Bags</button>
              <button class="filter-btn" type="button" data-category="Jewelry">Jewelry</button>
            </div>
          </div>
          <div class="product-grid" data-shop-grid></div>
        </div>
      </section>
    </main>
    <div data-newsletter></div>
    <div data-site-footer></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
