<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Review your Ornava shopping cart before checkout." />
  <title>Cart | Ornava</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="cart.html">
  <div class="site-shell">
    <div data-site-header></div>
    <main class="site-main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Cart</p>
          <h1>Review your items before checkout.</h1>
        </div>
      </section>
      <section class="section">
        <div class="container cart-grid">
          <div class="cart-list" data-cart-items></div>
          <aside class="cart-summary" data-cart-summary></aside>
        </div>
      </section>
    </main>
    <div data-newsletter></div>
    <div data-site-footer></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
