<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Complete your Ornava purchase with secure payment and shipping details." />
  <title>Checkout | Ornava</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="checkout.html">
  <div class="site-shell">
    <div data-site-header></div>
    <main class="site-main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Checkout</p>
          <h1>Secure checkout for your Ornava order.</h1>
        </div>
      </section>
      <section class="section">
        <div class="container checkout-grid">
          <div class="checkout-card">
            <form class="checkout-form" data-checkout-form>
              <div class="form-grid two">
                <input class="field" type="text" name="firstName" placeholder="First name" required />
                <input class="field" type="text" name="lastName" placeholder="Last name" required />
              </div>
              <input class="field" type="email" name="email" placeholder="Email address" required />
              <input class="field" type="text" name="address" placeholder="Street address" required />
              <div class="form-grid two">
                <input class="field" type="text" name="city" placeholder="City" required />
                <input class="field" type="text" name="state" placeholder="State" required />
              </div>
              <div class="form-grid two">
                <input class="field" type="text" name="zip" placeholder="ZIP code" required />
                <input class="field" type="tel" name="phone" placeholder="Phone number" required />
              </div>
              <div class="panel-card">
                <h3>Payment Method</h3>
                <label><input type="radio" name="payment" value="card" checked /> Credit / Debit Card</label><br />
                <label><input type="radio" name="payment" value="paypal" /> PayPal</label><br />
                <label><input type="radio" name="payment" value="upi" /> UPI</label><br />
                <label><input type="radio" name="payment" value="cod" /> Cash on Delivery</label>
              </div>
              <button class="btn" type="submit">Place Order</button>
              <p class="status-text" data-checkout-message></p>
            </form>
          </div>
          <aside class="checkout-card" data-checkout-summary></aside>
        </div>
      </section>
    </main>
    <div data-newsletter></div>
    <div data-site-footer></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
