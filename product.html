<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View Ornava product details, imagery, specifications, and purchase options." />
  <title>Product | Ornava</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="product.html">
  <div class="site-shell">
    <div data-site-header></div>
    <main class="site-main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Product</p>
          <h1>Product details and purchase options.</h1>
        </div>
      </section>
      <section class="section">
        <div class="container" data-product-detail></div>
      </section>
      <section class="section">
        <div class="container">
          <p class="eyebrow">You May Also Like</p>
          <div class="product-grid" data-product-grid data-limit="4"></div>
        </div>
      </section>
    </main>
    <div data-newsletter></div>
    <div data-site-footer></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
